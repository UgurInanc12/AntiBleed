name: macOS Build
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version
      - name: Tools
        run: brew install meson ninja cmake || true
      - name: Cache WebRTC APM
        uses: actions/cache@v4
        with:
          path: build/webrtc
          key: webrtc-apm-macos-${{ hashFiles('WEBRTC_REVISION') }}
      - name: Full build (APM -> AECBridge -> driver -> app) + all tests
        run: Scripts/build-app.sh release
      - name: Python harness against real AEC3
        run: |
          python3 -m venv .venv && .venv/bin/pip install -q -r Tests/requirements.txt
          ANTIBLEED_AEC_RUNNER=build/aec/aec_offline .venv/bin/python -m pytest Tests/ -v
      - name: Package (unsigned unless secrets present)
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
        run: Scripts/package.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: AntiBleed-macos
          path: build/AntiBleed.app
